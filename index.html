<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Jamil</title>
  <meta name="description" content="Ali Jamil | Data, innovation, startups, and digital strategy." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #efefed;
      --bg-alt: #e6e6e2;
      --panel: #f7f7f5;
      --text: #171717;
      --muted: #6f6f5b;
      --line: #cfcfc8;
      --line-strong: #b8b8b0;
      --accent: #d7c1a6;
      --accent-hover: #cfb697;
      --mocha: #8a6f57;
      --max: 1320px;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .shell {
      width: min(94%, var(--max));
      margin: 0 auto;
    }

    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(239,239,237,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    nav {
      width: min(94%, var(--max));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      gap: 20px;
    }

    .brand {
      font-size: 0.95rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .nav-links,
    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a,
    .nav-right a {
      font-size: 0.95rem;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .nav-links a:hover,
    .nav-right a:hover,
    .award-profile:hover .award-name,
    .gallery-nav a:hover {
      color: var(--mocha);
    }

    .social-row {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .social-link {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, color 0.2s ease;
      color: var(--muted);
      background: transparent;
      border: 0;
      padding: 0;
    }

    .social-link:hover {
      transform: translateY(-1px);
      color: var(--mocha);
    }

    .social-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    section {
      padding: 34px 0;
    }

    .awwwards-hero {
      padding: 52px 0 22px;
      text-align: center;
    }

    .award-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      font-size: clamp(1.05rem, 1.5vw, 1.35rem);
    }

    .date-pill {
      padding: 8px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: rgba(255,255,255,0.45);
      font-weight: 600;
    }

    .hero-title {
      font-size: clamp(4.6rem, 15vw, 8.8rem);
      line-height: 0.92;
      letter-spacing: -0.015em;
      font-weight: 800;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .award-profiles {
      display: flex;
      justify-content: center;
      gap: 34px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .award-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 280px;
      justify-content: center;
    }

    .award-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #cfcfcf, #8e8e8e);
      border: 1px solid rgba(0,0,0,0.08);
    }

    .award-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .award-copy {
      text-align: left;
    }

    .award-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }

    .award-name {
      font-size: clamp(1.5rem, 2.4vw, 2.2rem);
      font-weight: 700;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .award-tag {
      font-size: 0.84rem;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .award-line {
      width: 100%;
      max-width: 330px;
      height: 4px;
      background: var(--line-strong);
      border-radius: 999px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 0;
      min-height: 560px;
      border-top: 1px solid rgba(0,0,0,0.06);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      overflow: hidden;
      margin-top: 8px;
    }

    .gallery-left,
    .gallery-right {
      position: relative;
      min-height: 560px;
    }

    .gallery-left {
      background:
        linear-gradient(rgba(0,0,0,0.22), rgba(0,0,0,0.18)),
        radial-gradient(circle at 25% 20%, rgba(255,255,255,0.22), transparent 18%),
        url('assets/img/PitchNight2.jpg') center 30% / cover;
    }

    .gallery-right {
      background:
        linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.1)),
        radial-gradient(circle at 80% 25%, rgba(255,255,255,0.2), transparent 18%),
        url('assets/img/alizine/alizine3.jpg') center/cover;
      border-left: 1px solid rgba(255,255,255,0.12);
    }

    .grain::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.16) 0.7px, transparent 0.7px);
      background-size: 4px 4px;
      opacity: 0.24;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .gallery-nav {
      position: absolute;
      top: 26px;
      right: 30px;
      display: flex;
      gap: 28px;
      z-index: 2;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.88rem;
      font-weight: 700;
      color: rgba(255,255,255,0.88);
    }

    .gallery-nav a {
      transition: color 0.2s ease;
    }

    .gallery-caption {
      position: absolute;
      left: 34px;
      bottom: 30px;
      z-index: 2;
      color: white;
      max-width: 480px;
    }

    .gallery-caption .kicker {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
      opacity: 0.92;
    }

    .gallery-caption h2 {
      font-size: clamp(2.2rem, 4.8vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      margin-bottom: 12px;
    }

    .gallery-caption p {
      font-size: 1rem;
      line-height: 1.5;
      color: rgba(255,255,255,0.82);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .section-head h2 {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      letter-spacing: -0.05em;
    }

    .section-head p,
    .card p,
    .project-pill p {
      color: var(--muted);
    }

    .cards-3,
    .cards-2,
    .feature-grid,
    .project-stack {
      display: grid;
      gap: 18px;
    }

    .cards-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .cards-2,
    .feature-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .card,
    .project-pill {
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: var(--radius);
      padding: 26px;
    }

    .card .kicker,
    .project-pill .meta {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .card h3,
    .project-pill h3 {
      letter-spacing: -0.04em;
    }

    footer {
      padding: 8px 0 36px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 1100px) {
      .gallery-grid,
      .cards-3,
      .cards-2,
      .feature-grid {
        grid-template-columns: 1fr;
      }

      .gallery-right {
        border-left: 0;
        border-top: 1px solid rgba(255,255,255,0.12);
      }
    }

    @media (max-width: 780px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links,
      .nav-right {
        flex-wrap: wrap;
        gap: 14px;
      }

      .awwwards-hero {
        padding-top: 26px;
      }

      .hero-title {
        font-size: 3.6rem;
      }

      .award-profile {
        min-width: 100%;
        justify-content: flex-start;
      }

      .gallery-left,
      .gallery-right {
        min-height: 380px;
      }

      .gallery-caption h2 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
